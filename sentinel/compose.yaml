services:
  aegis-server:
    build: .
    env_file: .env
    environment:
      AEGIS_DB_PATH: /app/data/aegis.db
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - aegis-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  aegis-data:
